[versions]
agp                  = "8.13.2"
kotlin               = "1.9.24"
compose-bom          = "2024.05.00"
compose-compiler     = "1.5.14"
hilt                 = "2.51.1"
hilt-navigation      = "1.2.0"
room                 = "2.6.1"
ksp                  = "1.9.24-1.0.20"
navigation-compose   = "2.7.7"
lifecycle            = "2.7.0"
coroutines           = "1.8.1"
zxing                = "3.5.3"
work                 = "2.9.0"
datastore            = "1.1.1"
material3            = "1.2.1"
activity-compose     = "1.9.0"
core-ktx             = "1.13.1"
appcompat            = "1.7.0"
splash               = "1.0.1"
material             = "1.12.0"
camerax              = "1.3.4"
mlkit-barcode        = "17.3.0"
accompanist          = "0.34.0"
usb-serial           = "3.7.2"

[plugins]
android-application  = { id = "com.android.application",             version.ref = "agp"    }
kotlin-android       = { id = "org.jetbrains.kotlin.android",        version.ref = "kotlin" }
hilt-android         = { id = "com.google.dagger.hilt.android",      version.ref = "hilt"   }
ksp                  = { id = "com.google.devtools.ksp",             version.ref = "ksp"    }

[libraries]
# Kotlin / Coroutines
kotlin-stdlib            = { group = "org.jetbrains.kotlin",  name = "kotlin-stdlib",           version.ref = "kotlin"     }
coroutines-android       = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# AndroidX Core
core-ktx                 = { group = "androidx.core",         name = "core-ktx",                version.ref = "core-ktx"   }
appcompat                = { group = "androidx.appcompat",     name = "appcompat",               version.ref = "appcompat"  }
splash                   = { group = "androidx.core",          name = "core-splashscreen",       version.ref = "splash"     }
material                 = { group = "com.google.android.material", name = "material",           version.ref = "material"   }

# Compose (BOM manages versions)
compose-bom              = { group = "androidx.compose",       name = "compose-bom",             version.ref = "compose-bom" }
compose-ui               = { group = "androidx.compose.ui",    name = "ui"                       }
compose-ui-tooling       = { group = "androidx.compose.ui",    name = "ui-tooling"               }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview"       }
compose-foundation       = { group = "androidx.compose.foundation", name = "foundation"          }
compose-material3        = { group = "androidx.compose.material3", name = "material3"            }
compose-material-icons   = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-animation        = { group = "androidx.compose.animation", name = "animation"            }
compose-runtime          = { group = "androidx.compose.runtime",   name = "runtime"              }
compose-graphics         = { group = "androidx.compose.ui",        name = "ui-graphics"          }

# Activity + Lifecycle
activity-compose         = { group = "androidx.activity",      name = "activity-compose",        version.ref = "activity-compose" }
lifecycle-viewmodel      = { group = "androidx.lifecycle",     name = "lifecycle-viewmodel-ktx",  version.ref = "lifecycle"  }
lifecycle-compose        = { group = "androidx.lifecycle",     name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-runtime        = { group = "androidx.lifecycle",     name = "lifecycle-runtime-ktx",    version.ref = "lifecycle"  }

# Navigation
navigation-compose       = { group = "androidx.navigation",    name = "navigation-compose",       version.ref = "navigation-compose" }

# Hilt
hilt-android             = { group = "com.google.dagger",      name = "hilt-android",             version.ref = "hilt"  }
hilt-compiler            = { group = "com.google.dagger",      name = "hilt-android-compiler",    version.ref = "hilt"  }
hilt-navigation-compose  = { group = "androidx.hilt",          name = "hilt-navigation-compose",  version.ref = "hilt-navigation" }

# Room
room-runtime             = { group = "androidx.room",          name = "room-runtime",             version.ref = "room" }
room-ktx                 = { group = "androidx.room",          name = "room-ktx",                 version.ref = "room" }
room-compiler            = { group = "androidx.room",          name = "room-compiler",            version.ref = "room" }

# DataStore
datastore-preferences    = { group = "androidx.datastore",     name = "datastore-preferences",    version.ref = "datastore" }

# WorkManager
work-runtime             = { group = "androidx.work",          name = "work-runtime-ktx",         version.ref = "work" }
hilt-work                = { group = "androidx.hilt",          name = "hilt-work",                version = "1.2.0" }
hilt-work-compiler       = { group = "androidx.hilt",          name = "hilt-compiler",            version = "1.2.0" }

# ZXing (QR codes)
zxing-core               = { group = "com.google.zxing",       name = "core",                     version.ref = "zxing" }

# CameraX
camera-camera2           = { group = "androidx.camera",        name = "camera-camera2",           version.ref = "camerax" }
camera-lifecycle         = { group = "androidx.camera",        name = "camera-lifecycle",         version.ref = "camerax" }
camera-view              = { group = "androidx.camera",        name = "camera-view",              version.ref = "camerax" }

# ML Kit Barcode Scanning
mlkit-barcode            = { group = "com.google.mlkit",       name = "barcode-scanning",         version.ref = "mlkit-barcode" }

# Accompanist Permissions
accompanist-permissions  = { group = "com.google.accompanist", name = "accompanist-permissions",  version.ref = "accompanist" }

# USB Serial (LoRa via ESP32/CP2102/CH340)
usb-serial               = { group = "com.github.mik3y",       name = "usb-serial-for-android",   version.ref = "usb-serial" }

# Test
junit                    = { group = "junit",                  name = "junit",                    version = "4.13.2" }
compose-ui-test          = { group = "androidx.compose.ui",    name = "ui-test-junit4"            }
