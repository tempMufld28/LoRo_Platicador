# Project-wide Gradle settings.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the Gradle Daemon.
# Setting a larger heap and metaspace helps with memory-intensive tasks like Kotlin compilation and KSP.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# AndroidX and Jetifier settings
android.useAndroidX=true
android.enableJetifier=true

# Permite builds en rutas con caracteres no-ASCII (ej. "Ángel" en el path de Windows)
android.overridePathCheck=true
